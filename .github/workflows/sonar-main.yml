name: Sonar main readiness

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  readiness:
    if: >-
      vars.SONAR_MAIN_ENABLED == 'true' &&
      github.repository == 'andregoepel/core' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: andregoepel/workflows/.github/workflows/sonar-library.yml@64b791bc90feadfd21a8cc3cf73b14456172334b
    with:
      tool-revision: 64b791bc90feadfd21a8cc3cf73b14456172334b
