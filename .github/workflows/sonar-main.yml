name: Sonar main readiness

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  readiness:
    if: >-
      vars.SONAR_MAIN_ENABLED == 'true' &&
      github.repository == 'andregoepel/core' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: andregoepel/workflows/.github/workflows/sonar-library.yml@752a04b788fd1cdb41e810ab62c184fe141d240a
    secrets:
      SONAR_SCAN_TOKEN: ${{ secrets.SONAR_SCAN_TOKEN }}
      SONAR_VERIFY_TOKEN: ${{ secrets.SONAR_VERIFY_TOKEN }}
    with:
      tool-revision: 752a04b788fd1cdb41e810ab62c184fe141d240a
