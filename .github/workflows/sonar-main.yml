name: Sonar main readiness

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  readiness:
    if: >-
      vars.SONAR_MAIN_ENABLED == 'true' &&
      github.repository == 'andregoepel/core' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: andregoepel/workflows/.github/workflows/sonar-library.yml@f6c806d1060e390a24c1451e7486578c9bdbab23
    secrets: inherit
    with:
      tool-revision: f6c806d1060e390a24c1451e7486578c9bdbab23
